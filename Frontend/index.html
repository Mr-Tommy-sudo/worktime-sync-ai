<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkTime Sync AI</title>
    
    <!-- Подключаем библиотеку Tailwind для базовых стилей -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Подключаем наш собственный CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Подключаем наш JavaScript (defer означает, что скрипт загрузится после HTML) -->
    <script src="script.js" defer></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <nav class="bg-white shadow-sm mb-8">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-600">WorkTime Sync AI</h1>
            <div class="space-x-4">
                <span class="text-sm text-slate-500">Пользователь: <span class="font-semibold text-slate-700">Иван Иванов</span></span>
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-4">

        <!-- Шаг 1: Ввод текста -->
        <div id="step-input" class="bg-white rounded-xl shadow-md p-6 mb-6 transition-all custom-card">
            <h2 class="text-lg font-semibold mb-2">Как прошел ваш рабочий день?</h2>
            <p class="text-slate-500 text-sm mb-4">Опишите свои задачи свободным текстом, а ИИ сам распределит часы по проектам.</p>
            
            <textarea id="user-text" rows="4" 
                class="w-full border border-slate-300 rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
                placeholder="Например: С утра 2 часа был на планировании спринта, потом до вечера (около 5 часов) писал код..."></textarea>
            
            <button id="btn-parse" 
                class="mt-4 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition-colors flex justify-center items-center gap-2">
                <span>Отправить ИИ-помощнику ✨</span>
                <svg id="loader-parse" class="animate-spin h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            </button>
            <p id="error-message" class="text-red-500 text-sm mt-3 hidden"></p>
        </div>

        <!-- Шаг 2: Подтверждение -->
        <div id="step-confirm" class="bg-white rounded-xl shadow-md p-6 mb-6 hidden border-l-4 border-green-500 custom-card">
            <h2 class="text-lg font-semibold text-green-700 mb-4">ИИ распознал ваши задачи:</h2>
            
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm text-slate-500 mb-1">Проект</label>
                    <select id="select-project" class="w-full border border-slate-300 rounded-lg p-2 outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="">Загрузка проектов...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-500 mb-1">Часы</label>
                    <input type="number" step="0.5" id="input-hours" 
                        class="w-full border border-slate-300 rounded-lg p-2 outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <div class="flex gap-3 mt-6">
                <button id="btn-save" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-semibold py-2 rounded-lg transition-colors">
                    Всё верно, сохранить
                </button>
                <button id="btn-cancel" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 rounded-lg transition-colors">
                    Отмена
                </button>
            </div>
        </div>

        <!-- Экран успеха -->
        <div id="success-message" class="bg-green-50 text-green-800 rounded-xl p-6 text-center hidden custom-card">
            <span class="text-4xl mb-2 block">🎉</span>
            <h3 class="text-lg font-bold">Отлично! Время записано.</h3>
            <p class="text-sm mt-1">HR-отдел будет доволен.</p>
            <button id="btn-reset" class="mt-4 text-indigo-600 underline font-medium">Добавить еще запись</button>
        </div>

    </main>
</body>
</html>
